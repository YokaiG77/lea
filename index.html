<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>LÉA</title>
<style>
:root{--vert:#33ea14;--violet:#aa00f8;--fond:#0a0a0a;--panneau:#141414;--bord:#262626;--texte:#ece9f2;--texte-2:#9a94a6;--erreur:#ff3b5c;--accent:var(--violet);
  --titre:"Ethnocentric","Orbitron",system-ui,sans-serif;--corps:system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fond);color:var(--texte);font:16px/1.45 var(--corps)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.065) 1px,transparent 1.2px);background-size:16px 16px;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--vert);outline-offset:2px}

/* en-tete */
.tete{display:flex;align-items:center;gap:14px;padding:14px 16px 12px;border-bottom:1px solid #1d1d1d;position:relative}
.tete::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--accent),transparent 70%);transition:background .4s}
#anneau{width:58px;height:58px;flex:none}
.id{flex:1;min-width:0}
.nom{font:400 21px/1 var(--titre);letter-spacing:.14em;text-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent)}
.etat{margin-top:6px;font-size:14px;font-weight:600;color:var(--accent-texte,var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lien{width:10px;height:10px;border-radius:50%;background:#444;flex:none;align-self:flex-start;margin-top:6px}
.lien.ok{background:var(--vert);box-shadow:0 0 8px var(--vert)}
.lien.ko{background:var(--erreur)}

/* actions rapides */
.rapides{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-bottom:1px solid #1d1d1d;flex:none}
.rapides::-webkit-scrollbar{display:none}
.puce{flex:none;padding:8px 13px;background:var(--panneau);border:1px solid var(--bord);font-size:14px;white-space:nowrap;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.puce:active{border-color:var(--vert);color:var(--vert)}
.puce.scene{border-color:#3b1a52}
.puce.actif{background:var(--violet);border-color:var(--violet);color:#fff}

/* conversation */
.fil{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.vide{margin:auto;text-align:center;color:var(--texte-2);max-width:28ch;font-size:15px}
.msg{max-width:88%;padding:9px 13px 10px;background:var(--panneau);font-size:15.5px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.msg .h{display:block;font-size:12px;color:#6d6778;margin-bottom:2px}
.toi{align-self:flex-end;border-right:2px solid var(--vert)}
.lea{align-self:flex-start;border-left:2px solid var(--violet)}
.erreur{align-self:stretch;max-width:none;border-left:2px solid var(--erreur);color:#ffc6d0}
.rappel{align-self:stretch;max-width:none;border-left:2px solid var(--vert);background:#132310}
.action{align-self:flex-start;display:flex;gap:9px;align-items:baseline;font-size:13.5px;color:var(--texte-2);padding-left:4px;max-width:94%}
.action::before{content:"";flex:none;width:7px;height:7px;transform:rotate(45deg) translateY(-1px);background:var(--violet);box-shadow:0 0 6px var(--violet)}
.action b{color:var(--texte);font-weight:600}

/* saisie */
.bas{display:flex;align-items:flex-end;gap:10px;padding:10px 12px 12px;border-top:1px solid #1d1d1d;flex:none;background:rgba(10,10,10,.92)}
.bas textarea{flex:1;resize:none;min-height:46px;max-height:130px;padding:11px 12px;background:var(--panneau);border:1px solid var(--bord);color:var(--texte);font:inherit;outline:none;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.bas textarea:focus{border-color:var(--vert)}
.bas textarea::placeholder{color:#6d6778}
.envoyer{height:46px;padding:0 14px;background:var(--vert);color:#061202;font-weight:700;display:none;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.ecrit .envoyer{display:block}
.ecrit .micro{display:none}
.micro{width:64px;height:64px;flex:none;display:grid;place-items:center;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
  background:#16091f;border:2px solid var(--violet);color:var(--texte);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.micro svg{width:26px;height:26px}
.micro.enreg{background:var(--vert);border-color:var(--vert);color:#061202;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.astuce{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#1b1b1b;border:1px solid var(--bord);padding:7px 12px;font-size:13px;color:var(--texte-2);
  white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.astuce.vue{opacity:1}

/* confirmation */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.voile.ouvert{display:flex}
.carte{width:100%;max-width:460px;background:#111;border:1px solid var(--violet);padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.carte p{font-size:17px;margin-bottom:16px}
.carte .choix{display:flex;gap:10px}
.carte button{flex:1;height:52px;font-weight:700;font-size:17px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.oui{background:var(--vert);color:#061202}
.non{background:#262626}

/* appairage */
.appairage{margin:auto;padding:24px;text-align:center;max-width:32ch;color:var(--texte-2)}
.appairage h2{font:400 18px var(--titre);color:var(--texte);letter-spacing:.1em;margin-bottom:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="tete">
  <canvas id="anneau" width="116" height="116" aria-hidden="true"></canvas>
  <div class="id">
    <div class="nom" id="nom">LÉA</div>
    <div class="etat" id="etat" aria-live="polite">Connexion…</div>
  </div>
  <span class="lien" id="lien" title="Connexion au PC"></span>
</header>

<nav class="rapides" id="rapides" aria-label="Actions rapides"></nav>

<main class="fil" id="fil">
  <p class="vide" id="vide">Maintiens le bouton micro pour parler à Léa, ou écris ta demande. Tout s'exécute sur ton PC.</p>
</main>

<form class="bas" id="form">
  <textarea id="texte" rows="1" placeholder="Écris à Léa" aria-label="Message pour Léa" enterkeyhint="send"></textarea>
  <button class="envoyer" type="submit">Envoyer</button>
  <button class="micro" id="micro" type="button" aria-label="Maintenir pour parler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div class="astuce" id="astuce">Maintiens appuyé pendant que tu parles</div>
</form>

<div class="voile" id="voile" role="dialog" aria-modal="true" aria-labelledby="q">
  <div class="carte"><p id="q"></p><div class="choix"><button class="oui" id="c-oui">Oui</button><button class="non" id="c-non">Non</button></div></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const COUL = {vert:"#33ea14", violet:"#aa00f8", inactif:"#3a3a3a", erreur:"#ff3b5c"};
const ETATS = {loading:["Démarrage","violet"], idle:["Prête","violet"], listening:["J'écoute","vert"], transcribing:["Je transcris","violet"],
  thinking:["Je réfléchis","violet"], speaking:["Je parle","vert"], paused:["Écoute du PC en pause","inactif"], updating:["Mise à jour","violet"],
  error:["Problème","erreur"], offline:["PC injoignable","erreur"]};
const NOMS = {obs_control:"OBS", window_control:"Fenêtres", media_control:"Musique", youtube_music:"YouTube Music", app_shortcut:"Raccourci",
  discord_send:"Discord", run_powershell:"Commande", open_target:"Ouverture", create_reminder:"Rappel", list_reminders:"Rappels",
  cancel_reminder:"Rappel annulé", add_note:"Note", read_text_file:"Lecture", write_text_file:"Écriture", list_directory:"Dossier", web_search:"Recherche web"};

/* ---------- jeton d'appairage ---------- */
const stock = {get:k => { try { return localStorage.getItem(k) || ""; } catch(e) { return ""; } },
               set:(k,v) => { try { localStorage.setItem(k, v); } catch(e) {} }};
let token = stock.get("lea_token"), canal = stock.get("lea_canal"), BASE = stock.get("lea_base");
const NTFY = "https://ntfy.sh";
// le lien d'appairage ressemble a .../#t=JETON&c=CANAL (le # n'est jamais envoye a un serveur)
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("t") && h.get("c")) {
  token = h.get("t"); canal = h.get("c"); BASE = "";
  stock.set("lea_token", token); stock.set("lea_canal", canal); stock.set("lea_base", "");
  history.replaceState(null, "", location.pathname);
}

/* adresse actuelle du PC : publiee par Lea sur le canal ntfy secret a chaque demarrage */
async function trouverPC(){
  const r = await fetch(`${NTFY}/${encodeURIComponent(canal)}/json?poll=1&since=24h`, {cache:"no-store"});
  if (!r.ok) throw new Error("ntfy " + r.status);
  const lignes = (await r.text()).trim().split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e) { return null; } });
  const msgs = lignes.filter(m => m && m.event === "message" && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test((m.message || "").trim()));
  if (!msgs.length) return "";
  return msgs[msgs.length - 1].message.trim();
}

let etat = "loading", pause = false, enLigne = false, erreurJusqua = 0;
function appliquer(){
  let e = !enLigne ? "offline" : Date.now() < erreurJusqua ? "error" : (pause && etat === "idle") ? "paused" : etat;
  const [txt, c] = ETATS[e] || ETATS.idle;
  document.documentElement.style.setProperty("--accent", COUL[c]);
  document.documentElement.style.setProperty("--accent-texte", c === "inactif" ? "#9a94a6" : COUL[c]);
  $("etat").textContent = txt;
  $("lien").className = "lien " + (enLigne ? "ok" : "ko");
  const bp = document.querySelector('[data-a="lea_pause"]');
  if (bp) bp.classList.toggle("actif", pause);
}

if (!token || !canal) {
  $("fil").innerHTML = '<div class="appairage"><h2>APPAIRAGE</h2><p>Sur ton PC, lance <b>installer_telephone.bat</b>, puis scanne le QR code affiché avec l\'appareil photo de ce téléphone.</p></div>';
  $("form").style.display = "none"; $("rapides").style.display = "none";
  $("etat").textContent = "Pas encore appairé";
  return;
}

async function api(path, opts = {}){
  if (!BASE) throw new Error("PC injoignable pour le moment.");
  opts.headers = Object.assign({"X-Lea-Token": token}, opts.headers || {});
  const r = await fetch(BASE + path, opts);
  if (r.status === 401) throw new Error("Appairage refusé : rescanne le QR code depuis ton PC.");
  if (!r.ok) throw new Error("Le PC a répondu une erreur " + r.status + ".");
  return r.json();
}

/* ---------- conversation ---------- */
function ajouter(type, texte, extra, heure){
  $("vide")?.remove();
  const fil = $("fil"), enBas = fil.scrollHeight - fil.scrollTop - fil.clientHeight < 60;
  let el;
  if (type === "action"){
    el = document.createElement("div"); el.className = "action";
    const s = document.createElement("span"), b = document.createElement("b");
    b.textContent = extra || "Action"; s.append(b, " : " + texte); el.append(s);
  } else {
    el = document.createElement("div"); el.className = "msg " + type;
    const h = document.createElement("span"); h.className = "h";
    h.textContent = (type === "rappel" ? "Rappel, " : type === "erreur" ? "Problème, " : "") + (heure || new Date().toTimeString().slice(0,5));
    el.append(h, document.createTextNode(texte));
  }
  fil.append(el);
  while (fil.children.length > 150) fil.firstElementChild.remove();
  if (enBas || type === "toi") fil.scrollTop = fil.scrollHeight;
}
function traiter(ev, rejoue){
  switch(ev.kind){
    case "hello": $("fil").querySelectorAll(".msg,.action").forEach(n => n.remove()); (ev.history||[]).forEach(h => traiter(h, true)); break;
    case "state": etat = ev.state; break;
    case "paused": pause = !!ev.value; break;
    case "user": ajouter("toi", ev.text, null, ev.time); break;
    case "assistant": ajouter("lea", ev.text, null, ev.time); break;
    case "tool": ajouter("action", ev.text, NOMS[ev.name] || ev.name); break;
    case "reminder": ajouter("rappel", ev.text, null, ev.time); break;
    case "error": ajouter("erreur", ev.text, null, ev.time); if (!rejoue) erreurJusqua = Date.now() + 2500; break;
    case "audio": if (!rejoue) jouer(ev.id); break;
    case "confirm": demander(ev.id, ev.text); break;
    case "confirm_done": if (confirmId === ev.id) fermerConfirm(); break;
  }
  appliquer();
}

/* ---------- flux d'evenements du PC ---------- */
let source = null, essais = 0, minuterie = null;
async function connecter(redecouvrir){
  clearTimeout(minuterie);
  if (source) { source.close(); source = null; }
  try {
    if (redecouvrir || !BASE) { const u = await trouverPC(); if (u) { BASE = u; stock.set("lea_base", u); } }
  } catch(e) { /* ntfy injoignable : on garde la derniere adresse connue */ }
  if (!BASE) { enLigne = false; appliquer(); return planifier(); }
  source = new EventSource(BASE + "/api/events?t=" + encodeURIComponent(token));
  source.onopen = () => { essais = 0; enLigne = true; appliquer(); chargerInfos(); };
  source.onmessage = m => { try { traiter(JSON.parse(m.data)); } catch(e) {} };
  source.onerror = () => { enLigne = false; appliquer(); source.close(); source = null; planifier(); };
}
function planifier(){
  // Lea a peut-etre redemarre avec une nouvelle adresse : on la recherche, de plus en plus espace
  essais++;
  minuterie = setTimeout(() => connecter(true), Math.min(30000, 2000 * essais));
}
connecter(false);

/* ---------- voix de Lea sur le telephone ---------- */
const lecteur = new Audio(); const file = []; let lecture = false;
function jouer(id){ file.push(id); suivant(); }
function suivant(){
  if (lecture || !file.length) return;
  lecture = true;
  lecteur.src = BASE + "/api/audio/" + file.shift() + "?t=" + encodeURIComponent(token);
  lecteur.play().catch(() => { lecture = false; });
}
lecteur.onended = lecteur.onerror = () => { lecture = false; suivant(); };
// Chrome autorise le son des qu'on a touche la page une fois (micro, bouton, envoi).

/* ---------- confirmations ---------- */
let confirmId = null;
function demander(id, texte){ confirmId = id; $("q").textContent = texte; $("voile").classList.add("ouvert"); $("c-non").focus(); navigator.vibrate?.(60); }
function fermerConfirm(){ confirmId = null; $("voile").classList.remove("ouvert"); }
async function repondre(oui){
  const id = confirmId; fermerConfirm();
  try { await api("/api/confirm", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, answer: oui})}); }
  catch(e) { ajouter("erreur", e.message); }
}
$("c-oui").onclick = () => repondre(true);
$("c-non").onclick = () => repondre(false);

/* ---------- actions rapides ---------- */
const RAPIDES = [["music_toggle","Pause / lecture"],["music_next","Suivant"],["music_restart","Au début"]];
async function rapide(action, value){
  navigator.vibrate?.(25);
  try { const r = await api("/api/quick", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action, value})}); }
  catch(e) { ajouter("erreur", e.message); }
}
function puce(label, action, value, cls){
  const b = document.createElement("button"); b.className = "puce" + (cls ? " " + cls : ""); b.textContent = label;
  b.dataset.a = action; b.onclick = () => rapide(action, value); return b;
}
async function chargerInfos(){
  try {
    const info = await api("/api/info");
    if (info.name) { $("nom").textContent = info.name.toUpperCase(); document.title = info.name; }
    pause = !!info.paused;
    const r = $("rapides"); r.innerHTML = "";
    RAPIDES.forEach(([a,l]) => r.append(puce(l, a)));
    if (info.shortcuts?.includes("discord_micro")) r.append(puce("Micro Discord", "discord_micro"));
    if (info.shortcuts?.includes("discord_sourdine")) r.append(puce("Sourdine", "discord_sourdine"));
    r.append(puce("Écoute PC", "lea_pause"));
    (info.scenes || []).forEach(s => r.append(puce(s, "obs_scene", s, "scene")));
    appliquer();
  } catch(e) { /* le PC peut ne pas etre pret, on reessaiera a la prochaine connexion */ }
}

/* ---------- saisie texte ---------- */
const form = $("form"), texte = $("texte");
texte.addEventListener("input", () => {
  form.classList.toggle("ecrit", texte.value.trim().length > 0);
  texte.style.height = ""; texte.style.height = Math.min(130, texte.scrollHeight + 2) + "px";
});
form.onsubmit = async e => {
  e.preventDefault();
  const t = texte.value.trim(); if (!t) return;
  texte.value = ""; texte.style.height = ""; form.classList.remove("ecrit");
  try { await api("/api/message", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text: t})}); }
  catch(err) { ajouter("erreur", err.message); }
};

/* ---------- micro : maintenir pour parler ---------- */
const micro = $("micro"); let rec = null, morceaux = [], debut = 0, flux = null;
async function commencer(e){
  e.preventDefault();
  if (rec) return;
  try {
    flux = flux || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  } catch(err) { ajouter("erreur", "Micro refusé : autorise-le pour cette appli dans les réglages de Chrome."); return; }
  morceaux = []; debut = Date.now();
  rec = new MediaRecorder(flux, MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? {mimeType:"audio/webm;codecs=opus"} : {});
  rec.ondataavailable = ev => ev.data.size && morceaux.push(ev.data);
  rec.onstop = envoyerVoix;
  rec.start();
  micro.classList.add("enreg"); navigator.vibrate?.(30);
  etat = "listening"; appliquer();
}
function arreter(){
  if (!rec) return;
  micro.classList.remove("enreg");
  if (rec.state !== "inactive") rec.stop();
}
async function envoyerVoix(){
  const duree = Date.now() - debut, blob = new Blob(morceaux, {type: rec.mimeType || "audio/webm"});
  rec = null;
  if (duree < 500) { $("astuce").classList.add("vue"); setTimeout(() => $("astuce").classList.remove("vue"), 1800); etat = "idle"; appliquer(); return; }
  etat = "transcribing"; appliquer();
  try {
    if (!BASE) throw new Error("PC injoignable pour le moment.");
    const r = await fetch(BASE + "/api/voice", {method:"POST", headers:{"X-Lea-Token": token, "Content-Type": blob.type}, body: blob});
    if (r.status === 401) throw new Error("Appairage refusé : rescanne le QR code depuis ton PC.");
    const j = await r.json();
    if (!j.text) { ajouter("erreur", "Je n'ai rien compris, réessaie un peu plus près du micro."); etat = "idle"; appliquer(); }
  } catch(err) { ajouter("erreur", err.message || "Envoi de la voix impossible."); etat = "idle"; appliquer(); }
}
micro.addEventListener("pointerdown", commencer);
micro.addEventListener("pointerup", arreter);
micro.addEventListener("pointercancel", arreter);
micro.addEventListener("pointerleave", arreter);
micro.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- noyau anime ---------- */
const cv = $("anneau"), cx = cv.getContext("2d"), N = 20, reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
function dessiner(now){
  const t = now / 1000;
  const e = !enLigne ? "offline" : (pause && etat === "idle") ? "paused" : etat;
  const c = COUL[(ETATS[e] || ETATS.idle)[1]];
  cx.clearRect(0,0,116,116);
  for (let i = 0; i < N; i++){
    const a = i / N * Math.PI * 2 - Math.PI / 2;
    let o = .2;
    if (reduit) o = .6;
    else if (e === "idle" || e === "loading") o = .15 + .35 * Math.pow(Math.max(0, Math.cos(a - t)), 6);
    else if (e === "thinking" || e === "transcribing") o = .1 + .9 * Math.max(0, 1 - ((t * 14 - i + N * 99) % N) / 6);
    else if (e === "listening" || e === "speaking") o = .3 + .7 * Math.abs(Math.sin(t * 7 + i * .9) * Math.sin(t * 3 + i * .4));
    else if (e === "paused") o = i % 2 ? .5 : .15;
    else o = .3 + .5 * Math.abs(Math.sin(t * 4));
    cx.save(); cx.translate(58,58); cx.rotate(a); cx.globalAlpha = o; cx.fillStyle = c;
    if (o > .55) { cx.shadowColor = c; cx.shadowBlur = 8; }
    cx.fillRect(40, -2.2, 12, 4.4); cx.restore();
  }
  cx.globalAlpha = 1; cx.beginPath();
  for (let k = 0; k < 6; k++){ const a = Math.PI / 3 * k - Math.PI / 2; const x = 58 + 27 * Math.cos(a), y = 58 + 27 * Math.sin(a); k ? cx.lineTo(x,y) : cx.moveTo(x,y); }
