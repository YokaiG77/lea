<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1C1B20">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<title>Léa</title>
<style>
:root{
  --fond:#1C1B20; --texte:#ECE9F1; --texte-2:#A7A1B3; --heure:#8D869A;
  --sauge:#8FC4A6; --sauge-txt:#A9D6BC; --sauge-ico:#A9CDB8; --sauge-sombre:#14201A;
  --surf-toi:#22322A; --surf-carte:#1D2622; --bord-carte:#2C3D34; --surf-btn:#212A25; --bord-saisie:#2F4A3D;
  --lilas:#B49BF0; --corail:#E8798A; --corail-txt:#F2B3BC; --pause:#8D869A;
  --corps:"Geist",system-ui,"Segoe UI",Roboto,sans-serif; --marque:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--fond);color:var(--texte);font:16px/1.45 var(--corps)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sauge);outline-offset:2px}

/* en-tete */
.tete{display:flex;align-items:center;gap:14px;padding:18px 20px 16px;flex:none}
.id{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nom{font:italic 500 27px/1 var(--marque)}
.etat{font-size:14px;color:var(--sauge);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.lien{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--heure);padding:6px 11px;border-radius:999px;background:var(--surf-btn);flex:none}
.lien::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pause)}
.lien.ok::before{background:var(--sauge)}
.lien.ko::before{background:var(--corail)}
.trait{height:1px;margin:0 20px;background:linear-gradient(90deg,#4F7D66,#2A3530 60%);flex:none}

/* orbe */
.orbe{--t:46px;width:var(--t);height:var(--t);flex:none;border-radius:50%;position:relative;display:grid;place-items:center;
  background:#1F2B25;box-shadow:inset 0 0 0 1px var(--bord-saisie);transition:background .35s,box-shadow .35s}
.orbe>*{position:absolute;transition:opacity .25s}
.point{width:30.8%;height:30.8%;border-radius:50%;background:#5E8C74}
.anneau2,.coeur{border-radius:50%;opacity:0}
.anneau2{width:73%;height:73%;background:rgba(143,196,166,.32)}
.coeur{width:42%;height:42%;background:var(--sauge);animation:respire 1.2s ease-in-out infinite}
.ondes{display:flex;gap:5.8%;align-items:center;justify-content:center;width:60%;height:60%;opacity:0}
.ondes i{display:block;width:5.8%;min-width:2.5px;border-radius:2px;background:var(--fond);height:30%}
.spin{inset:-1px;border-radius:50%;opacity:0;background:conic-gradient(from 0deg,transparent 0 62%,var(--lilas) 92%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
  animation:tourne 1.1s linear infinite}
.barres{display:flex;gap:16%;width:34%;height:34%;justify-content:center;opacity:0}
.barres i{display:block;width:28%;height:100%;border-radius:2px;background:var(--pause)}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes respire{50%{transform:scale(1.18);opacity:.75}}
@keyframes onde{0%,100%{height:28%}50%{height:var(--h,80%)}}
.ondes i:nth-child(1){--h:45%;animation-delay:-.2s!important}
.ondes i:nth-child(2){--h:95%;animation-delay:-.5s!important}
.ondes i:nth-child(3){--h:65%;animation-delay:-.1s!important}
.ondes i:nth-child(4){--h:85%;animation-delay:-.7s!important}
.ondes i:nth-child(5){--h:40%;animation-delay:-.35s!important}
[data-e="idle"] .point,[data-e="loading"] .point,[data-e="updating"] .point{animation:respire 3.2s ease-in-out infinite}
[data-e="listening"] .orbe{background:rgba(143,196,166,.18);box-shadow:0 0 0 6px rgba(143,196,166,.10)}
[data-e="listening"] .point{opacity:0}
[data-e="listening"] .anneau2,[data-e="listening"] .coeur{opacity:1}
[data-e="speaking"] .orbe{background:var(--lilas);box-shadow:0 0 0 6px rgba(180,155,240,.16)}
[data-e="speaking"] .point{opacity:0}
[data-e="speaking"] .ondes{opacity:1}
[data-e="speaking"] .ondes i{animation:onde .9s ease-in-out infinite}
[data-e="thinking"] .spin,[data-e="transcribing"] .spin,[data-e="loading"] .spin,[data-e="updating"] .spin{opacity:1}
[data-e="thinking"] .point,[data-e="transcribing"] .point{background:var(--lilas);animation:respire 1.4s ease-in-out infinite}
[data-e="loading"] .spin,[data-e="updating"] .spin{animation-duration:2.2s}
[data-e="paused"] .orbe{background:#25242A;box-shadow:inset 0 0 0 1px #393841}
[data-e="paused"] .point{opacity:0}
[data-e="paused"] .barres{opacity:1}
[data-e="error"] .orbe,[data-e="offline"] .orbe{background:#2E2026;box-shadow:inset 0 0 0 1px #5A3440}
[data-e="error"] .point,[data-e="offline"] .point{background:var(--corail);animation:none}

/* actions rapides */
.rapides{display:flex;gap:8px;overflow-x:auto;padding:0 20px 14px;scrollbar-width:none;flex:none}
.rapides::-webkit-scrollbar{display:none}
.puce{flex:none;padding:8px 14px;border-radius:999px;background:var(--surf-btn);color:var(--sauge-ico);font-size:14px;white-space:nowrap;transition:background .15s}
.puce:active{background:#2C3A32}
.puce.scene{background:none;box-shadow:inset 0 0 0 1px var(--bord-saisie);color:var(--texte-2)}
.puce.actif{background:var(--sauge);color:var(--sauge-sombre)}

/* conversation */
.fil{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.vide{margin:auto;text-align:center;color:var(--heure);max-width:28ch;font-size:15px;line-height:1.5}
.bloc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bloc.toi{align-items:flex-end;gap:6px}
.etiq{font-size:12.5px;color:var(--heure)}
.bulle{max-width:84%;background:var(--surf-toi);border-radius:20px 20px 6px 20px;padding:11px 16px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.texte{font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;max-width:100%}
.bloc.erreur .texte{color:var(--corail-txt)}
.carte{align-self:stretch;background:var(--surf-carte);border:1px solid var(--bord-carte);border-radius:16px;padding:11px 15px;display:flex;flex-direction:column}
.rang{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;font-size:14px;padding:9px 0}
.rang+.rang{border-top:1px solid var(--bord-carte)}
.rang:first-child{padding-top:0}.rang:last-child{padding-bottom:0}
.quoi{flex:none;display:inline-flex;align-items:center;gap:8px;color:var(--texte-2);line-height:1.45}
.quoi::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sauge)}
.rang.echec .quoi::before{background:var(--corail)}
.resultat{text-align:right;min-width:0;word-wrap:break-word}
.pastille{display:inline-flex;align-items:center;gap:7px;background:var(--surf-toi);color:var(--sauge-txt);border-radius:999px;padding:7px 13px;font-size:13.5px;max-width:100%}
.pastille svg{width:14px;height:14px;flex:none}

/* saisie */
.bas{display:flex;align-items:flex-end;gap:10px;padding:10px 14px 16px;flex:none;position:relative}
.bas textarea{flex:1;resize:none;min-height:56px;max-height:130px;padding:16px 20px;border:1px solid var(--bord-saisie);border-radius:28px;background:var(--surf-btn);font-size:16px;line-height:1.4;outline:none;scrollbar-width:none}
.bas textarea:focus{border-color:#4F7D66}
.bas textarea::placeholder{color:var(--heure)}
.rond{width:56px;height:56px;flex:none;border-radius:50%;background:var(--sauge);color:var(--sauge-sombre);display:grid;place-items:center;transition:transform .15s,box-shadow .2s,background .2s}
.rond svg{width:22px;height:22px}
.envoyer{display:none}
.ecrit .envoyer{display:grid}
.ecrit .micro{display:none}
.micro{touch-action:none;user-select:none;-webkit-user-select:none}
.micro.enreg{transform:scale(1.1);box-shadow:0 0 0 8px rgba(143,196,166,.18),0 0 0 16px rgba(143,196,166,.08)}
.astuce{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:var(--surf-carte);border:1px solid var(--bord-carte);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--texte-2);
  white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.astuce.vue{opacity:1}

/* confirmation */
.voile{position:fixed;inset:0;background:rgba(14,13,17,.72);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}
.voile.ouvert{display:flex}
.feuille{width:100%;max-width:460px;background:var(--surf-carte);border:1px solid var(--bord-carte);border-radius:24px;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.feuille .etiq{display:block;margin-bottom:6px}
.feuille p{font-size:17px;line-height:1.45;margin-bottom:18px}
.feuille .choix{display:flex;gap:10px}
.feuille button{flex:1;height:52px;border-radius:999px;font-weight:600;font-size:16.5px}
.oui{background:var(--sauge);color:var(--sauge-sombre)}
.non{background:var(--surf-btn);color:var(--sauge-ico)}

/* appairage */
.appairage{margin:auto;padding:24px;text-align:center;max-width:32ch;color:var(--texte-2);line-height:1.55}
.appairage h2{font:italic 500 24px var(--marque);color:var(--texte);margin-bottom:10px}
.appairage b{color:var(--texte);font-weight:500}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-e="loading">
<header class="tete">
  <div class="orbe" aria-hidden="true">
    <span class="point"></span><span class="anneau2"></span><span class="coeur"></span>
    <span class="ondes"><i></i><i></i><i></i><i></i><i></i></span>
    <span class="spin"></span><span class="barres"><i></i><i></i></span>
  </div>
  <div class="id">
    <span class="nom" id="nom">léa</span>
    <span class="etat" id="etat" aria-live="polite">connexion…</span>
  </div>
  <span class="lien" id="lien">PC</span>
</header>

<nav class="rapides" id="rapides" aria-label="Actions rapides"></nav>
<div class="trait"></div>

<main class="fil" id="fil">
  <p class="vide" id="vide">Maintiens le micro pour parler à Léa, ou écris ta demande. Tout s'exécute sur ton PC.</p>
</main>

<form class="bas" id="form">
  <textarea id="texte" rows="1" placeholder="Écris à Léa" aria-label="Message pour Léa" enterkeyhint="send"></textarea>
  <button class="rond envoyer" type="submit" aria-label="Envoyer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>
  <button class="rond micro" id="micro" type="button" aria-label="Maintenir pour parler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div class="astuce" id="astuce">Maintiens appuyé pendant que tu parles</div>
</form>

<div class="voile" id="voile" role="dialog" aria-modal="true" aria-labelledby="q">
  <div class="feuille"><span class="etiq">Léa te demande</span><p id="q"></p><div class="choix"><button class="oui" id="c-oui">Oui</button><button class="non" id="c-non">Non</button></div></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const ETATS = {loading:["démarrage","--lilas"], idle:["prête","--sauge"], listening:["je t'écoute","--sauge"], transcribing:["je transcris","--lilas"],
  thinking:["je réfléchis","--lilas"], speaking:["je parle","--lilas"], paused:["écoute du PC en pause","--pause"], updating:["mise à jour","--lilas"],
  error:["un souci","--corail"], offline:["PC injoignable","--corail"]};
const NOMS = {obs_control:"OBS", window_control:"Fenêtres", media_control:"Musique", youtube_music:"YouTube Music", app_shortcut:"Raccourci",
  discord_send:"Discord", run_powershell:"Commande", open_target:"Ouverture", create_reminder:"Rappel", list_reminders:"Rappels",
  cancel_reminder:"Rappel annulé", add_note:"Note", read_text_file:"Lecture", write_text_file:"Écriture", list_directory:"Dossier",
  web_search:"Recherche web", game:"Jeu", routine:"Routine", session:"Session", memory:"Mémoire"};
let nomAff = "Léa";

/* ---------- jeton d'appairage ---------- */
const stock = {get:k => { try { return localStorage.getItem(k) || ""; } catch(e) { return ""; } },
               set:(k,v) => { try { localStorage.setItem(k, v); } catch(e) {} }};
let token = stock.get("lea_token"), canal = stock.get("lea_canal"), BASE = stock.get("lea_base");
const NTFY = "https://ntfy.sh";
// le lien d'appairage ressemble a .../#t=JETON&c=CANAL (le # n'est jamais envoye a un serveur)
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("t") && h.get("c")) {
  token = h.get("t"); canal = h.get("c"); BASE = "";
  stock.set("lea_token", token); stock.set("lea_canal", canal); stock.set("lea_base", "");
  history.replaceState(null, "", location.pathname);
}

/* adresse actuelle du PC : publiee par Lea sur le canal ntfy secret a chaque demarrage */
async function trouverPC(){
  const r = await fetch(`${NTFY}/${encodeURIComponent(canal)}/json?poll=1&since=24h`, {cache:"no-store"});
  if (!r.ok) throw new Error("ntfy " + r.status);
  const lignes = (await r.text()).trim().split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e) { return null; } });
  const msgs = lignes.filter(m => m && m.event === "message" && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test((m.message || "").trim()));
  if (!msgs.length) return "";
  return msgs[msgs.length - 1].message.trim();
}

let etat = "loading", pause = false, enLigne = false, erreurJusqua = 0;
function appliquer(){
  const e = !enLigne ? "offline" : Date.now() < erreurJusqua ? "error" : (pause && etat === "idle") ? "paused" : etat;
  const [txt, c] = ETATS[e] || ETATS.idle;
  document.body.dataset.e = e;
  $("etat").textContent = txt; $("etat").style.color = `var(${c})`;
  $("lien").className = "lien " + (enLigne ? "ok" : "ko");
  $("lien").textContent = enLigne ? "PC relié" : "PC hors ligne";
  const bp = document.querySelector('[data-a="lea_pause"]');
  if (bp) bp.classList.toggle("actif", pause);
}

if (!token || !canal) {
  $("fil").innerHTML = '<div class="appairage"><h2>Bienvenue</h2><p>Sur ton PC, lance <b>installer_telephone.bat</b>, puis scanne le QR code affiché avec l\'appareil photo de ce téléphone.</p></div>';
  $("form").style.display = "none"; $("rapides").style.display = "none";
  $("etat").textContent = "pas encore appairée"; $("lien").textContent = "PC non relié"; $("lien").className = "lien";
  return;
}

async function api(path, opts = {}){
  if (!BASE) throw new Error("PC injoignable pour le moment.");
  opts.headers = Object.assign({"X-Lea-Token": token}, opts.headers || {});
  const r = await fetch(BASE + path, opts);
  if (r.status === 401) throw new Error("Appairage refusé : rescanne le QR code depuis ton PC.");
  if (!r.ok) throw new Error("Le PC a répondu une erreur " + r.status + ".");
  return r.json();
}

/* ---------- conversation ---------- */
const ICO_RAPPEL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="11" r="6.5"/><path d="M10 7.5V11l2.5 1.5"/></svg>';
let blocLea = null;
function el(tag, cls, txt){ const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function hh(t){ return t || new Date().toTimeString().slice(0,5); }
function enBas(){ const f = $("fil"); return f.scrollHeight - f.scrollTop - f.clientHeight < 60; }
function poser(n, forcer){
  $("vide")?.remove();
  const f = $("fil"), bas = enBas();
  f.append(n);
  while (f.children.length > 150) f.firstElementChild.remove();
  if (bas || forcer) f.scrollTop = f.scrollHeight;
}
function nouveauBloc(type, etiq, t){ const b = el("div", "bloc " + type); b.append(el("span", "etiq", etiq + ", " + hh(t))); return b; }
function ouvrirLea(t){ if (!blocLea || !blocLea.isConnected) { blocLea = nouveauBloc("lea", nomAff, t); poser(blocLea); } return blocLea; }
function suivre(bas){ if (bas) $("fil").scrollTop = $("fil").scrollHeight; }

function ajouterToi(texte, t){ blocLea = null; const b = nouveauBloc("toi", "Toi", t); b.append(el("div", "bulle", texte)); poser(b, true); }
function ajouterLea(texte, t){
  const bas = enBas(), b = ouvrirLea(t);
  b.insertBefore(el("div", "texte", texte), b.querySelector(".pastille"));
  if (t) b.firstElementChild.textContent = nomAff + ", " + t;
  blocLea = null; suivre(bas);
}
function ajouterAction(nom, texte){
  const bas = enBas(), b = ouvrirLea();
  if (nom === "create_reminder") { const p = el("span", "pastille"); p.innerHTML = ICO_RAPPEL; p.append(texte); b.append(p); }
  else {
    let carte = b.querySelector(".carte");
    if (!carte) { carte = el("div", "carte"); b.append(carte); }
    const r = el("div", "rang" + (/(échec|annulé|Erreur)/.test(texte) ? " echec" : ""));
    r.append(el("span", "quoi", NOMS[nom] || nom), el("span", "resultat", texte));
    carte.append(r);
  }
  suivre(bas);
}
function ajouterRappel(texte, t){
  blocLea = null;
  const b = nouveauBloc("lea", nomAff, t), p = el("span", "pastille");
  p.innerHTML = ICO_RAPPEL; p.append("Rappel"); b.append(p, el("div", "texte", texte)); poser(b, true);
}
function ajouterErreur(texte, t){ blocLea = null; const b = nouveauBloc("erreur", "Un souci", t); b.append(el("div", "texte", texte)); poser(b, true); }

function traiter(ev, rejoue){
  switch(ev.kind){
    case "hello": $("fil").querySelectorAll(".bloc").forEach(n => n.remove()); blocLea = null; (ev.history||[]).forEach(x => traiter(x, true)); break;
    case "state": etat = ev.state; break;
    case "paused": pause = !!ev.value; break;
    case "user": ajouterToi(ev.text, ev.time); break;
    case "assistant": ajouterLea(ev.text, ev.time); break;
    case "tool": ajouterAction(ev.name, ev.text); break;
    case "reminder": ajouterRappel(ev.text, ev.time); break;
    case "error": ajouterErreur(ev.text, ev.time); if (!rejoue) { erreurJusqua = Date.now() + 2500; setTimeout(appliquer, 2600); } break;
    case "audio": if (!rejoue) jouer(ev.id); break;
    case "confirm": demander(ev.id, ev.text); break;
    case "confirm_done": if (confirmId === ev.id) fermerConfirm(); break;
  }
  appliquer();
}

/* ---------- flux d'evenements du PC ---------- */
let source = null, essais = 0, minuterie = null;
async function connecter(redecouvrir){
  clearTimeout(minuterie);
  if (source) { source.close(); source = null; }
  try {
    if (redecouvrir || !BASE) { const u = await trouverPC(); if (u) { BASE = u; stock.set("lea_base", u); } }
  } catch(e) { /* ntfy injoignable : on garde la derniere adresse connue */ }
  if (!BASE) { enLigne = false; appliquer(); return planifier(); }
  source = new EventSource(BASE + "/api/events?t=" + encodeURIComponent(token));
  source.onopen = () => { essais = 0; enLigne = true; appliquer(); chargerInfos(); };
  source.onmessage = m => { try { traiter(JSON.parse(m.data)); } catch(e) {} };
  source.onerror = () => { enLigne = false; appliquer(); source.close(); source = null; planifier(); };
}
function planifier(){
  // Lea a peut-etre redemarre avec une nouvelle adresse : on la recherche, de plus en plus espace
  essais++;
  minuterie = setTimeout(() => connecter(true), Math.min(30000, 2000 * essais));
}
connecter(false);

/* ---------- voix de Lea sur le telephone ---------- */
const lecteur = new Audio(); const file = []; let lecture = false;
function jouer(id){ file.push(id); suivant(); }
function suivant(){
  if (lecture || !file.length) return;
  lecture = true;
  lecteur.src = BASE + "/api/audio/" + file.shift() + "?t=" + encodeURIComponent(token);
  lecteur.play().catch(() => { lecture = false; });
}
lecteur.onended = lecteur.onerror = () => { lecture = false; suivant(); };

/* ---------- confirmations ---------- */
let confirmId = null;
function demander(id, texte){ confirmId = id; $("q").textContent = texte; $("voile").classList.add("ouvert"); navigator.vibrate?.(60); }
function fermerConfirm(){ confirmId = null; $("voile").classList.remove("ouvert"); }
async function repondre(oui){
  const id = confirmId; fermerConfirm();
  try { await api("/api/confirm", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, answer: oui})}); }
  catch(e) { ajouterErreur(e.message); }
}
$("c-oui").onclick = () => repondre(true);
$("c-non").onclick = () => repondre(false);

/* ---------- actions rapides ---------- */
const RAPIDES = [["music_toggle","Pause / lecture"],["music_next","Suivant"],["music_restart","Au début"]];
async function rapide(action, value){
  navigator.vibrate?.(25);
  try { await api("/api/quick", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action, value})}); }
  catch(e) { ajouterErreur(e.message); }
}
function puce(label, action, value, cls){
  const b = document.createElement("button"); b.className = "puce" + (cls ? " " + cls : ""); b.textContent = label;
  b.dataset.a = action; b.onclick = () => rapide(action, value); return b;
}
async function chargerInfos(){
  try {
    const info = await api("/api/info");
    if (info.name) { nomAff = info.name; $("nom").textContent = info.name.toLowerCase(); document.title = info.name; }
    pause = !!info.paused;
    const r = $("rapides"); r.innerHTML = "";
    RAPIDES.forEach(([a,l]) => r.append(puce(l, a)));
    if (info.shortcuts?.includes("discord_micro")) r.append(puce("Micro Discord", "discord_micro"));
    if (info.shortcuts?.includes("discord_sourdine")) r.append(puce("Sourdine", "discord_sourdine"));
    r.append(puce("Écoute PC", "lea_pause"));
    (info.scenes || []).forEach(s => r.append(puce(s, "obs_scene", s, "scene")));
    appliquer();
  } catch(e) { /* le PC peut ne pas etre pret, on reessaiera a la prochaine connexion */ }
}

/* ---------- saisie texte ---------- */
const form = $("form"), texte = $("texte");
texte.addEventListener("input", () => {
  form.classList.toggle("ecrit", texte.value.trim().length > 0);
  texte.style.height = ""; texte.style.height = Math.min(130, texte.scrollHeight + 2) + "px";
});
form.onsubmit = async e => {
  e.preventDefault();
  const t = texte.value.trim(); if (!t) return;
  texte.value = ""; texte.style.height = ""; form.classList.remove("ecrit");
  try { await api("/api/message", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text: t})}); }
  catch(err) { ajouterErreur(err.message); }
};

/* ---------- micro : maintenir pour parler ---------- */
const micro = $("micro"); let rec = null, morceaux = [], debut = 0, flux = null;
async function commencer(e){
  e.preventDefault();
  if (rec) return;
  try {
    flux = flux || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  } catch(err) { ajouterErreur("Micro refusé : autorise-le pour cette appli dans les réglages de Chrome."); return; }
  morceaux = []; debut = Date.now();
  rec = new MediaRecorder(flux, MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? {mimeType:"audio/webm;codecs=opus"} : {});
  rec.ondataavailable = ev => ev.data.size && morceaux.push(ev.data);
  rec.onstop = envoyerVoix;
  rec.start();
  micro.classList.add("enreg"); navigator.vibrate?.(30);
  etat = "listening"; appliquer();
}
function arreter(){
  if (!rec) return;
  micro.classList.remove("enreg");
  if (rec.state !== "inactive") rec.stop();
}
async function envoyerVoix(){
  const duree = Date.now() - debut, blob = new Blob(morceaux, {type: rec.mimeType || "audio/webm"});
  rec = null;
  if (duree < 500) { $("astuce").classList.add("vue"); setTimeout(() => $("astuce").classList.remove("vue"), 1800); etat = "idle"; appliquer(); return; }
  etat = "transcribing"; appliquer();
  try {
    if (!BASE) throw new Error("PC injoignable pour le moment.");
    const r = await fetch(BASE + "/api/voice", {method:"POST", headers:{"X-Lea-Token": token, "Content-Type": blob.type}, body: blob});
    if (r.status === 401) throw new Error("Appairage refusé : rescanne le QR code depuis ton PC.");
    const j = await r.json();
    if (!j.text) { ajouterErreur("Je n'ai rien compris, réessaie un peu plus près du micro."); etat = "idle"; appliquer(); }
  } catch(err) { ajouterErreur(err.message || "Envoi de la voix impossible."); etat = "idle"; appliquer(); }
}
micro.addEventListener("pointerdown", commencer);
micro.addEventListener("pointerup", arreter);
micro.addEventListener("pointercancel", arreter);
micro.addEventListener("pointerleave", arreter);
micro.addEventListener("contextmenu", e => e.preventDefault());

appliquer();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !enLigne) connecter(true); });
})();
